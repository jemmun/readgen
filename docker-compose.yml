version: "3.8"

services:
  backend:
    build: ./backend
    container_name: readgen-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - readgen_data:/app
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: readgen-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  readgen_data:
